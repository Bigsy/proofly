<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Proofly fixture — scroll container</title>
  <style>
    body { font: 16px/1.5 sans-serif; margin: 40px; max-width: 640px; }
    .spacer { height: 60vh; background: repeating-linear-gradient(#fafafa, #eee 40px); }
    .scroller { height: 240px; overflow: auto; border: 1px solid #999; padding: 12px; }
    textarea { width: 100%; height: 120px; font: inherit; padding: 10px; }
  </style>
</head>
<body>
  <h1>Scroll container</h1>
  <p>Underlines must track BOTH page scroll and scrolling inside the
     <code>overflow: auto</code> box below (capture-phase scroll handling).</p>
  <div class="spacer"></div>
  <div class="scroller">
    <p>Some content above the field…</p>
    <textarea id="field"></textarea>
    <p>…and plenty below so the container actually scrolls.</p>
    <div class="spacer"></div>
  </div>
  <div class="spacer"></div>

  <script>
    window.__fixture = { inputEvents: 0 };
    document.getElementById("field").addEventListener("input", () => {
      window.__fixture.inputEvents++;
    });
  </script>
</body>
</html>

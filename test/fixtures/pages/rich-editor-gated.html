<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Proofly fixture - gated rich editor</title>
  <style>
    body { font: 16px/1.5 sans-serif; margin: 40px; }
    #field { border: 1px solid #999; min-height: 120px; padding: 10px; }
  </style>
</head>
<body>
  <div id="field" contenteditable="true" role="textbox" aria-multiline="true" data-proofly-fixture="rich-editor">
    <p><span>I seen it.</span><br><span>We eated bread.</span></p>
  </div>
</body>
</html>

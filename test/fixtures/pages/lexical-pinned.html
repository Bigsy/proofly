<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Proofly fixture - Lexical pinned</title>
  <style>
    body { font: 16px/1.5 sans-serif; margin: 40px; }
    #field {
      border: 1px solid #999;
      min-height: 120px;
      padding: 10px;
      white-space: pre-wrap;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "lexical": "/node_modules/lexical/dist/Lexical.prod.mjs",
        "@lexical/clipboard": "/node_modules/@lexical/clipboard/dist/LexicalClipboard.prod.mjs",
        "@lexical/dragon": "/node_modules/@lexical/dragon/dist/LexicalDragon.prod.mjs",
        "@lexical/extension": "/node_modules/@lexical/extension/dist/LexicalExtension.prod.mjs",
        "@lexical/history": "/node_modules/@lexical/history/dist/LexicalHistory.prod.mjs",
        "@lexical/html": "/node_modules/@lexical/html/dist/LexicalHtml.prod.mjs",
        "@lexical/list": "/node_modules/@lexical/list/dist/LexicalList.prod.mjs",
        "@lexical/plain-text": "/node_modules/@lexical/plain-text/dist/LexicalPlainText.prod.mjs",
        "@lexical/selection": "/node_modules/@lexical/selection/dist/LexicalSelection.prod.mjs",
        "@lexical/utils": "/node_modules/@lexical/utils/dist/LexicalUtils.prod.mjs"
      }
    }
  </script>
</head>
<body>
  <div id="field" contenteditable="true" role="textbox" aria-multiline="true" data-lexical-editor="true"></div>
  <script type="module">
    import {
      $createParagraphNode,
      $createTextNode,
      $getRoot,
      REDO_COMMAND,
      UNDO_COMMAND,
      createEditor,
    } from "lexical";
    import { registerHistory, createEmptyHistoryState } from "@lexical/history";
    import { registerPlainText } from "@lexical/plain-text";

    const root = document.querySelector("#field");
    const editor = createEditor({
      namespace: "proofly-lexical-fixture",
      onError(error) {
        window.__fixture.error = error.message;
        throw error;
      },
    });

    function editorText() {
      let text = "";
      editor.getEditorState().read(() => {
        text = $getRoot().getTextContent();
      });
      return text;
    }

    function domSelectionOffset() {
      const selection = getSelection();
      if (!selection?.rangeCount || !root.contains(selection.anchorNode)) return null;
      const before = document.createRange();
      before.selectNodeContents(root);
      before.setEnd(selection.anchorNode, selection.anchorOffset);
      return { offset: before.toString().length, collapsed: selection.isCollapsed };
    }

    function waitForSettledCommand(command) {
      return new Promise((resolve) => {
        let done = false;
        const cleanup = editor.registerUpdateListener(() => {
          if (done) return;
          done = true;
          cleanup();
          requestAnimationFrame(() => resolve(true));
        });
        const accepted = editor.dispatchCommand(command, undefined);
        setTimeout(() => {
          if (done) return;
          done = true;
          cleanup();
          resolve(accepted);
        }, 150);
      });
    }

    window.__fixture = {
      editor,
      root,
      ready: false,
      inputEvents: 0,
      updates: [],
      get domText() { return root.textContent; },
      get stateText() { return editorText(); },
      get selection() { return domSelectionOffset(); },
      undo() { return waitForSettledCommand(UNDO_COMMAND); },
      redo() { return waitForSettledCommand(REDO_COMMAND); },
      textNodeContaining(value) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue.includes(value)) return node;
        }
        return null;
      },
    };

    registerPlainText(editor);
    registerHistory(editor, createEmptyHistoryState(), 100);
    root.addEventListener("input", () => { window.__fixture.inputEvents += 1; });
    editor.registerUpdateListener(({ editorState }) => {
      editorState.read(() => {
        window.__fixture.updates.push($getRoot().getTextContent());
      });
    });
    editor.setRootElement(root);
    editor.update(() => {
      const lexicalRoot = $getRoot();
      lexicalRoot.clear();
      const paragraph = $createParagraphNode();
      paragraph.append($createTextNode("I seen it."));
      lexicalRoot.append(paragraph);
    }, {
      discrete: true,
      onUpdate: () => {
        window.__fixture.ready = true;
      },
    });
  </script>
</body>
</html>

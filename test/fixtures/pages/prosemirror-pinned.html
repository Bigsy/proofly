<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Proofly fixture - ProseMirror pinned</title>
  <style>
    body { font: 16px/1.5 sans-serif; margin: 40px; }
    .ProseMirror { border: 1px solid #999; min-height: 120px; padding: 10px; white-space: pre-wrap; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "orderedmap": "/node_modules/orderedmap/dist/index.js",
        "prosemirror-commands": "/node_modules/prosemirror-commands/dist/index.js",
        "prosemirror-history": "/node_modules/prosemirror-history/dist/index.js",
        "prosemirror-model": "/node_modules/prosemirror-model/dist/index.js",
        "prosemirror-schema-basic": "/node_modules/prosemirror-schema-basic/dist/index.js",
        "prosemirror-state": "/node_modules/prosemirror-state/dist/index.js",
        "prosemirror-transform": "/node_modules/prosemirror-transform/dist/index.js",
        "prosemirror-view": "/node_modules/prosemirror-view/dist/index.js",
        "rope-sequence": "/node_modules/rope-sequence/dist/index.js"
      }
    }
  </script>
</head>
<body>
  <div id="mount"></div>
  <script type="module">
    import { schema } from "prosemirror-schema-basic";
    import { EditorState, Plugin } from "prosemirror-state";
    import { Decoration, DecorationSet, EditorView } from "prosemirror-view";
    import { history, undo, redo } from "prosemirror-history";

    const doc = schema.node("doc", null, [
      schema.node("paragraph", null, [schema.text("I seen it.")]),
    ]);

    window.__fixture = {
      inputEvents: 0,
      transactions: [],
      get domText() { return window.__fixture.view.dom.textContent; },
      get stateText() { return window.__fixture.view.state.doc.textContent; },
      get selection() {
        const { from, to } = window.__fixture.view.state.selection;
        return { from, to };
      },
      get widgetCount() {
        return window.__fixture.view.dom.querySelectorAll("[data-proofly-pm-widget]").length;
      },
      undo() { return undo(window.__fixture.view.state, window.__fixture.view.dispatch, window.__fixture.view); },
      redo() { return redo(window.__fixture.view.state, window.__fixture.view.dispatch, window.__fixture.view); },
      textNodeContaining(value) {
        const walker = document.createTreeWalker(window.__fixture.view.dom, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue.includes(value)) return node;
        }
        return null;
      },
    };

    const widgetPlugin = new Plugin({
      props: {
        decorations(state) {
          const widget = Decoration.widget(3, () => {
            const el = document.createElement("span");
            el.dataset.prooflyPmWidget = "drag";
            el.contentEditable = "false";
            el.textContent = "::";
            return el;
          }, { side: -1 });
          return DecorationSet.create(state.doc, [widget]);
        },
      },
    });
    const plugins = [history()];
    if (new URLSearchParams(location.search).has("widget")) plugins.push(widgetPlugin);

    window.__fixture.view = new EditorView(document.querySelector("#mount"), {
      state: EditorState.create({ schema, doc, plugins }),
      dispatchTransaction(tr) {
        const nextState = this.state.apply(tr);
        this.updateState(nextState);
        window.__fixture.transactions.push({
          doc: nextState.doc.textContent,
          steps: tr.steps.length,
        });
      },
    });

    window.__fixture.view.dom.id = "field";
    window.__fixture.view.dom.addEventListener("input", () => {
      window.__fixture.inputEvents += 1;
    });
  </script>
</body>
</html>

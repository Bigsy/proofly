name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Bump version, commit and tag
        id: bump
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "$(jq -r .version manifest.json)"
          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          jq --arg v "$NEW" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json
          npm version "$NEW" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$NEW"
          git tag "v$NEW"
          git push origin HEAD "v$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Pack extension
        run: |
          zip="$(npm run --silent pack:store)"
          cp "$zip" "proofly-v${{ steps.bump.outputs.version }}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            "proofly-v${{ steps.bump.outputs.version }}.zip" \
            --generate-notes
